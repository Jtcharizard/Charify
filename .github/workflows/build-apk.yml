name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Charify-v0.5.0-Stable.apk
          sha256sum Charify-v0.5.0-Stable.apk > Charify-v0.5.0-Stable.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Charify-v0.5.0-Stable-APK
          path: |
            Charify-v0.5.0-Stable.apk
            Charify-v0.5.0-Stable.sha256
          retention-days: 30
